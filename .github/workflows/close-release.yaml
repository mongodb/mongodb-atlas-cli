name: Close Release

# Marks the Jira release complete once the GitHub release is published. The tag
# alone does not guarantee the Evergreen build/sign/publish succeeded, so the
# fix version is marked released and the release ticket resolved here rather than
# at tag time — see release.yaml.
#
# apix-action refs are pinned to the commit that added get-jira-version and the
# create/update extra-data fixes (mongodb/apix-action#302, CLOUDP-455888).

on:
  release:
    types: [published]

permissions: {}

jobs:
  finalize:
    name: Finalize AtlasCLI release
    # Only act on release tags in either supported format.
    if: startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'atlascli/v')
    runs-on: ubuntu-latest
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@v1
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}

      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        id: load-secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          JIRA_API_TOKEN: "op://APIx/JIRA service account/credential"

      - name: Determine version
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -Eeou pipefail
          # Support both the legacy 'atlascli/vX.Y.Z' and the new 'vX.Y.Z' tag formats.
          VERSION="${TAG##*/}"
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ignoring release with unexpected tag '${TAG}'." >&2
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "fix-version=atlascli-${VERSION}"
            echo "release-date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Find the fix version
        id: find-version
        uses: mongodb/apix-action/get-jira-version@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          project-key: CLOUDP
          name: ${{ steps.meta.outputs.fix-version }}

      - name: Find the release ticket
        id: find-release
        uses: mongodb/apix-action/find-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          jql: 'project = CLOUDP AND issuetype = Story AND summary ~ "AtlasCLI ${{ steps.meta.outputs.version }} Release" AND component = "AtlasCLI" AND "Assigned Teams" = "APIx DevTools"'
          fields: "status"

      - name: Resolve the release ticket status
        id: release-status
        env:
          FOUND: ${{ steps.find-release.outputs.found }}
          ISSUES: ${{ steps.find-release.outputs.issues }}
        run: |
          set -Eeou pipefail
          if [[ "${FOUND}" == "true" ]]; then
            echo "status=$(printf '%s' "${ISSUES}" | jq -r '.[0].fields.status.name // ""')" >> "$GITHUB_OUTPUT"
          else
            echo "status=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Documentation Changes on the release ticket
        # The CLOUDP "Resolve Issue" transition requires "Documentation Changes"
        # (customfield_10257). The release ticket itself needs no docs, so mark
        # it "Not Needed" before resolving (covers tickets created before the
        # field was set at creation).
        if: steps.find-release.outputs.found == 'true' && steps.release-status.outputs.status != 'Resolved' && steps.release-status.outputs.status != 'Closed'
        uses: mongodb/apix-action/update-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          issue-keys: ${{ steps.find-release.outputs.issue-key }}
          extra-data: '{"fields":{"customfield_10257":{"value":"Not Needed"}}}'

      - name: Resolve the release ticket
        # Skip when already resolved, so a re-run is a no-op.
        if: steps.find-release.outputs.found == 'true' && steps.release-status.outputs.status != 'Resolved' && steps.release-status.outputs.status != 'Closed'
        uses: mongodb/apix-action/transition-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          issue-key: ${{ steps.find-release.outputs.issue-key }}
          transition-name: "Resolve Issue"
          resolution: Fixed

      - name: Mark the fix version released
        # Run last: resolving the release ticket can fail (e.g. a required Jira
        # field), and we only want to mark the version released once the release
        # ticket is actually done.
        if: steps.find-version.outputs.found == 'true'
        uses: mongodb/apix-action/update-jira-version@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          version-id: ${{ steps.find-version.outputs.version-id }}
          released: "true"
          release-date: ${{ steps.meta.outputs.release-date }}
