# synced from apix-actions/.github/workflows/dependabot-jira.yaml
name: Dependabot PR automation

on:
  pull_request:
    # `synchronize` covers Dependabot rebases and recreates, which rewrite the PR
    # branch without opening a new PR. The job's actor guard keeps the workflow's
    # own post-update commit from re-triggering it.
    types: [opened, synchronize]

permissions: {}

jobs:
  dependabot:
    if: github.actor == 'dependabot[bot]'
    uses: mongodb/apix-action/.github/workflows/_dependabot-jira.yaml@b9d203ba30a17b2cae54f9bb2265b4142af38fec
    secrets: inherit