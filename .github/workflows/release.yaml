name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.60.0 (without the leading v)"
        required: true
        type: string
      # Commit to release. Defaults to master; set a ref or SHA to release a
      # specific commit (e.g. a hotfix that is not the tip of master).
      ref:
        description: "Commit SHA or ref to release (defaults to master)"
        required: false
        default: master
        type: string
      # Emergency escape hatch: cut a release even when a required test is red
      # (e.g. a known-flaky or unrelated failing check). Leave unchecked normally.
      force:
        description: "Release even if the required tests are failing (emergency use only)"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  release:
    name: Release AtlasCLI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@v1
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeou pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${VERSION}'. Expected X.Y.Z." >&2
            exit 1
          fi

      - name: Check the release tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -Eeou pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Aborting." >&2
            exit 1
          fi
          echo "Tag ${TAG} is free."

      - name: Check the release ref exists
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.ref }}
        run: |
          set -Eeou pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET}" >/dev/null 2>&1; then
            echo "Ref '${TARGET}' does not resolve to a commit in ${GITHUB_REPOSITORY}. Aborting." >&2
            exit 1
          fi
          echo "Ref ${TARGET} exists."

      - name: Verify required tests
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
          REQUIRED_TESTS: |
            evergreen/code_health
            docs
            mocks
            tidy
            lint
            shellcheck
            unit-tests (macos-latest)
            unit-tests (ubuntu-latest)
            unit-tests (windows-latest)
            libraryOwners
            licensecheck
            evergreen/goreleaser_atlascli_snapshot
            evergreen/pkg_smoke_tests_docker_atlascli
        run: |
          set -Eeou pipefail
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET}" --jq '.sha')
          echo "Releasing ${TARGET} (${SHA})"
          # 'evergreen/*' contexts are commit statuses; the rest are check runs.
          statuses=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses?per_page=100")
          checks=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")
          failed=0
          while IFS= read -r context; do
            [[ -n "${context}" ]] || continue
            if [[ "${context}" == evergreen/* ]]; then
              state=$(echo "${statuses}" | jq -r --arg c "${context}" \
                '[.[] | select(.context == $c)][0].state // "missing"')
            else
              state=$(echo "${checks}" | jq -r --arg n "${context}" \
                '[.check_runs[] | select(.name == $n)][0].conclusion // "missing"')
            fi
            echo "${context}: ${state}"
            case "${state}" in
              success|skipped|neutral) ;;
              *) failed=1 ;;
            esac
          done <<< "${REQUIRED_TESTS}"
          if [[ "${failed}" -ne 0 ]]; then
            if [[ "${FORCE}" == "true" ]]; then
              echo "::warning::Required tests did not pass on ${SHA}, but 'force' was set — releasing anyway."
            else
              echo "Required tests did not pass on ${SHA}. Aborting." >&2
              exit 1
            fi
          fi

      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        id: load-secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: "op://APIx/APIx Github Bot/App ID"
          APP_SECRET: "op://APIx/APIx Github Bot/App Secret"
          JIRA_API_TOKEN: "op://APIx/JIRA service account/credential"
      - id: decode-app-secret
        env:
          APP_SECRET: ${{ steps.load-secrets.outputs.APP_SECRET }}
        run: |
          {
            echo 'APP_PEM<<EOF'
            echo "${APP_SECRET}" | base64 -d | openssl pkey -inform DER -outform PEM
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Set Apix Bot token
        id: app-token
        uses: mongodb/apix-action/token@f7d2400a387dea2661651b14bbaf8c8f46c8bf66
        with:
          app-id: ${{ steps.load-secrets.outputs.APP_ID }}
          private-key: ${{ steps.decode-app-secret.outputs.APP_PEM }}

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine previous release tag
        id: previous
        run: |
          set -Eeou pipefail
          # Support both the legacy 'atlascli/vX.Y.Z' and the new 'vX.Y.Z' tag formats.
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' --match 'atlascli/v*' 2>/dev/null || true)
          echo "tag=${PREVIOUS}" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeou pipefail
          {
            echo "next-fix-version=next-atlascli-release"
            echo "fix-version=atlascli-${VERSION}"
            echo "tag=v${VERSION}"
          } >> "$GITHUB_OUTPUT"

      # ---- Fix versions -------------------------------------------------------

      - name: Find the rolling next fix version
        id: find-next-version
        uses: mongodb/apix-action/get-jira-version@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          project-key: CLOUDP
          name: ${{ steps.meta.outputs.next-fix-version }}

      - name: Create the rolling next fix version
        id: create-next-version
        if: steps.find-next-version.outputs.found != 'true'
        uses: mongodb/apix-action/create-jira-version@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          project-key: CLOUDP
          name: ${{ steps.meta.outputs.next-fix-version }}

      - name: Resolve the rolling next fix version id
        id: next-version
        env:
          FOUND: ${{ steps.find-next-version.outputs.found }}
          EXISTING: ${{ steps.find-next-version.outputs.version-id }}
          CREATED: ${{ steps.create-next-version.outputs.version-id }}
        run: |
          set -Eeou pipefail
          if [[ "${FOUND}" == "true" ]]; then
            echo "id=${EXISTING}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${CREATED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the release fix version
        id: find-release-version
        uses: mongodb/apix-action/get-jira-version@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          project-key: CLOUDP
          name: ${{ steps.meta.outputs.fix-version }}

      - name: Check the release fix version is not already released
        if: steps.find-release-version.outputs.found == 'true' && steps.find-release-version.outputs.released == 'true'
        run: |
          set -Eeou pipefail
          echo "Fix version ${{ steps.meta.outputs.fix-version }} is already released. Aborting." >&2
          exit 1

      # Skip the rename when the release version already exists, so a re-run
      # after a partial failure does not rename the rolling version twice.
      - name: Rename the rolling next fix version to the release fix version
        if: steps.find-release-version.outputs.found != 'true'
        uses: mongodb/apix-action/update-jira-version@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          version-id: ${{ steps.next-version.outputs.id }}
          new-name: ${{ steps.meta.outputs.fix-version }}

      # The rename consumed the rolling version; recreate it (unless it is
      # already there) so the next release has somewhere to go.
      - name: Find the rolling next fix version after the rename
        id: find-next-version-after
        uses: mongodb/apix-action/get-jira-version@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          project-key: CLOUDP
          name: ${{ steps.meta.outputs.next-fix-version }}

      - name: Create a new rolling next fix version
        if: steps.find-next-version-after.outputs.found != 'true'
        uses: mongodb/apix-action/create-jira-version@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          project-key: CLOUDP
          name: ${{ steps.meta.outputs.next-fix-version }}

      # ---- Release ticket -----------------------------------------------------

      - name: Find existing release ticket
        id: find-release
        uses: mongodb/apix-action/find-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          jql: 'project = CLOUDP AND issuetype = Story AND summary ~ "AtlasCLI ${{ inputs.version }} Release" AND component = "AtlasCLI" AND "Assigned Teams" = "APIx DevTools"'
          fields: "status"

      - name: Create release ticket
        id: create-release
        if: steps.find-release.outputs.found != 'true'
        uses: mongodb/apix-action/create-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          project-key: CLOUDP
          summary: "AtlasCLI ${{ inputs.version }} Release"
          description: |
            Release ticket for AtlasCLI ${{ inputs.version }}.

            This ticket is created and progressed by the "Release AtlasCLI" GitHub Actions
            workflow in mongodb/mongodb-atlas-cli.
          issuetype: Story
          assignee: cloud-atlascli-escalation
          components: AtlasCLI
          # extra-data is merged into the request body, so the fields must be
          # nested under "fields" (as the dependabot flow does) or Jira ignores
          # them. Assigned Teams (customfield_12751) is set by option id.
          extra-data: '{"fields":{"customfield_12751":[{"id":"22223"}],"fixVersions":[{"name":"${{ steps.meta.outputs.fix-version }}"}],"priority":{"id":"3"},"customfield_10257":{"value":"Not Needed"}}}'

      - name: Resolve release ticket key
        id: release-ticket
        env:
          FOUND: ${{ steps.find-release.outputs.found }}
          EXISTING: ${{ steps.find-release.outputs.issue-key }}
          CREATED: ${{ steps.create-release.outputs.issue-key }}
        run: |
          set -Eeou pipefail
          if [[ "${FOUND}" == "true" ]]; then
            echo "key=${EXISTING}" >> "$GITHUB_OUTPUT"
          else
            echo "key=${CREATED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release ticket status
        id: release-status
        env:
          FOUND: ${{ steps.find-release.outputs.found }}
          ISSUES: ${{ steps.find-release.outputs.issues }}
        run: |
          set -Eeou pipefail
          if [[ "${FOUND}" == "true" ]]; then
            echo "status=$(printf '%s' "${ISSUES}" | jq -r '.[0].fields.status.name // ""')" >> "$GITHUB_OUTPUT"
          else
            echo "status=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the release ticket is not already resolved
        # A resolved/closed release ticket means the release already happened.
        if: steps.release-status.outputs.status == 'Resolved' || steps.release-status.outputs.status == 'Closed'
        run: |
          set -Eeou pipefail
          echo "Release ticket ${{ steps.release-ticket.outputs.key }} is already ${{ steps.release-status.outputs.status }}. Aborting." >&2
          exit 1

      - name: Move release ticket to In Progress
        # Skip when the ticket is already In Progress, so a re-run is a no-op.
        if: steps.release-status.outputs.status != 'In Progress'
        uses: mongodb/apix-action/transition-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          issue-key: ${{ steps.release-ticket.outputs.key }}
          transition-name: "Start Progress"

      # ---- Reconcile the fix versions -----------------------------------------
      # Both moves run unconditionally (each skipped only when its query finds
      # nothing), so a re-run after a partial failure converges either way:
      #   - a rename drags every ticket onto the release version, so the
      #     still-open ones are moved back to the rolling version;
      #   - if the release version already existed (no rename), the shipped
      #     (closed/resolved) ones are moved forward onto it.
      # Whichever state a failure left, one move is a no-op and the other
      # completes the reconciliation.

      - name: Find still-open tickets on the release fix version
        id: to-move
        uses: mongodb/apix-action/find-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          # Key off status, not resolution: a reopened ticket keeps its last
          # resolution, so it must be matched by status. Exclude the release
          # ticket, which is still in progress and belongs on the release version.
          jql: 'project = CLOUDP AND fixVersion = "${{ steps.meta.outputs.fix-version }}" AND status NOT IN (Resolved, Closed) AND key != "${{ steps.release-ticket.outputs.key }}"'
          max-results: "1000"

      - name: Collect issue keys to move back
        id: to-move-keys
        if: steps.to-move.outputs.found == 'true'
        env:
          ISSUES: ${{ steps.to-move.outputs.issues }}
        run: |
          set -Eeou pipefail
          {
            echo "keys<<EOF"
            echo "${ISSUES}" | jq -r '.[].key'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Move still-open tickets back to the rolling next fix version
        if: steps.to-move.outputs.found == 'true'
        uses: mongodb/apix-action/update-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          issue-keys: ${{ steps.to-move-keys.outputs.keys }}
          extra-data: '{"fields":{"fixVersions":[{"name":"${{ steps.meta.outputs.next-fix-version }}"}]}}'

      - name: Find shipped tickets still on the rolling next fix version
        id: to-move-shipped
        uses: mongodb/apix-action/find-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          jql: 'project = CLOUDP AND fixVersion = "${{ steps.meta.outputs.next-fix-version }}" AND status IN (Resolved, Closed)'
          max-results: "1000"

      - name: Collect shipped issue keys
        id: to-move-shipped-keys
        if: steps.to-move-shipped.outputs.found == 'true'
        env:
          ISSUES: ${{ steps.to-move-shipped.outputs.issues }}
        run: |
          set -Eeou pipefail
          {
            echo "keys<<EOF"
            echo "${ISSUES}" | jq -r '.[].key'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Move shipped tickets to the release fix version
        if: steps.to-move-shipped.outputs.found == 'true'
        uses: mongodb/apix-action/update-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          issue-keys: ${{ steps.to-move-shipped-keys.outputs.keys }}
          extra-data: '{"fields":{"fixVersions":[{"name":"${{ steps.meta.outputs.fix-version }}"}]}}'

      # ---- Release notes ------------------------------------------------------

      - name: Extract release notes
        id: notes
        uses: mongodb/apix-action/find-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          # JQL has no `!=` for summary; exclude the release ticket by key instead.
          jql: 'project = CLOUDP AND fixVersion = "${{ steps.meta.outputs.fix-version }}" AND component NOT IN (Evergreen, Infrastructure, "OnPrem Packaging", Testing, Tests) AND key != "${{ steps.release-ticket.outputs.key }}" AND "Release Notes" IS NOT EMPTY AND resolution IN (Done, Fixed)'
          fields: "summary,Release Notes"
          max-results: "1000"

      - name: Build release notes description
        id: notes-body
        env:
          ISSUES: ${{ steps.notes.outputs.issues }}
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -Eeou pipefail
          {
            echo "body<<EOF"
            echo "Please use the [Atlas CLI Release Checklist|https://wiki.corp.mongodb.com/spaces/DOC/pages/165790822/Atlas+CLI+Release+Checklist] to publish these notes."
            echo "If [~corry.root@mongodb.com] is available, please route this ticket to them for docs review."
            echo ""
            echo "Changes since the previous release: https://github.com/mongodb/mongodb-atlas-cli/compare/${PREVIOUS_TAG}...v${VERSION}"
            echo ""
            echo "List of changes extracted from Jira tickets:"
            echo "${ISSUES}" | jq -r '.[] | select((.fields["Release Notes"] // "") != "") | "- " + .fields["Release Notes"]'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # TODO(CLOUDP-455888): the release-notes ticket belongs in DOCSP. It is
      # created in CLOUDP for now because the Jira service account lacks Create
      # Issues (and Link Issues) in DOCSP; switch both this JQL and the create
      # step below back to DOCSP once that permission is granted.
      - name: Find existing release notes ticket
        id: find-notes
        uses: mongodb/apix-action/find-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          jql: 'project = CLOUDP AND issuetype = Task AND summary ~ "AtlasCLI ${{ inputs.version }} Release Notes"'

      - name: Create release notes ticket
        id: create-notes
        if: steps.find-notes.outputs.found != 'true'
        uses: mongodb/apix-action/create-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          # TODO(CLOUDP-455888): move back to DOCSP once the service account has
          # Create Issues there (see the find step above).
          project-key: CLOUDP
          summary: "[AtlasCLI] AtlasCLI ${{ inputs.version }} Release Notes"
          description: ${{ steps.notes-body.outputs.body }}
          issuetype: Task

      - name: Resolve release notes ticket key
        id: notes-ticket
        env:
          FOUND: ${{ steps.find-notes.outputs.found }}
          EXISTING: ${{ steps.find-notes.outputs.issue-key }}
          CREATED: ${{ steps.create-notes.outputs.issue-key }}
        run: |
          set -Eeou pipefail
          if [[ "${FOUND}" == "true" ]]; then
            echo "key=${EXISTING}" >> "$GITHUB_OUTPUT"
          else
            echo "key=${CREATED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Link release and release notes tickets
        # Only when the notes ticket was just created, so a re-run does not add a
        # duplicate link.
        if: steps.create-notes.outcome == 'success'
        uses: mongodb/apix-action/link-jira@6b1aa6770badd9beddf1060a5b60cee9d1183571
        with:
          token: ${{ steps.load-secrets.outputs.JIRA_API_TOKEN }}
          inward-issue: ${{ steps.release-ticket.outputs.key }}
          outward-issue: ${{ steps.notes-ticket.outputs.key }}
          link-type: "Related"

      # The fix version is marked released and the release ticket resolved by
      # close-release.yaml, once the GitHub release is published.

      # ---- Tag ----------------------------------------------------------------

      - name: Create and push tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GIT_USER_NAME: ${{ steps.app-token.outputs.user-name }}
          GIT_USER_EMAIL: ${{ steps.app-token.outputs.user-email }}
        run: |
          set -Eeou pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists" >&2
            exit 1
          fi
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
