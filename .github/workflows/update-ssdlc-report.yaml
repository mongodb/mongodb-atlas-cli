name: Update Compliance Report

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'atlascli tag version (e.g. 1.42.2)'
        required: true
        type: string

jobs:
  update-compliance-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}
      - name: set Apix Bot token
        id: app-token
        uses: mongodb/apix-action/token@26969e1bb333b00a8c3a776f4f822a3ce01a667a
        with:
          app-id: ${{ secrets.APIXBOT_APP_ID }}
          private-key: ${{ secrets.APIXBOT_APP_PEM }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: master
      - name: Extract AUTHOR and VERSION
        id: extract
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_AUTHOR: ${{ github.actor }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Accept 'v1.42.2', 'atlascli/v1.42.2' or a full ref.
            TAG="$INPUT_TAG"
            AUTHOR="$DISPATCH_AUTHOR"
          else
            # GITHUB_REF is refs/tags/v1.42.2
            TAG="${GITHUB_REF#refs/tags/}"
            AUTHOR="$RELEASE_AUTHOR"
          fi
          # Normalize to a bare X.Y.Z, tolerating the legacy 'atlascli/' prefix.
          TAG="${TAG##*/}"
          VERSION="${TAG#v}"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run gen-ssdlc-report.sh
        env:
          AUTHOR: ${{ steps.extract.outputs.author }}
          VERSION: ${{ steps.extract.outputs.version }}
          AUGMENTED_REPORT: "false"
        run: ./build/package/gen-ssdlc-report.sh
      - name: Create compliance report pull request
        id: create-report-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: >-
            ${{ steps.app-token.outputs.user-name }}
            <${{ steps.app-token.outputs.user-email }}>
          author: >-
            ${{ steps.app-token.outputs.user-name }}
            <${{ steps.app-token.outputs.user-email }}>
          add-paths: >-
            compliance/v${{ steps.extract.outputs.version }}/ssdlc-compliance-${{ steps.extract.outputs.version }}.md
          base: master
          branch: "compliance/ssdlc-report-v${{ steps.extract.outputs.version }}"
          title: >-
            chore(compliance): update SSDLC report for v${{ steps.extract.outputs.version }}
          commit-message: >-
            chore(compliance): update SSDLC report for v${{ steps.extract.outputs.version }}
          body: >-
            Generated the SSDLC compliance report for release
            v${{ steps.extract.outputs.version }}. Please review and merge this PR.
          labels: compliance
      - name: Request Jira ticket
        if: steps.create-report-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-report-pr.outputs.pull-request-number }}
        run: gh pr edit "$PR_NUMBER" --add-label create_jira
