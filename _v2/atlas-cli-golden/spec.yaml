  /api/atlas/v2/groups/{groupId}/backup/exportBuckets:
    post:
      description: Creates a Snapshot Export Bucket for an AWS S3 Bucket, Azure Blob Storage Container, or Google Cloud Storage
        Bucket. Once created, an snapshots can be exported to the Export Bucket and its referenced AWS S3 Bucket, Azure Blob
        Storage Container, or Google Cloud Storage Bucket.
      operationId: createGroupBackupExportBucket
      tags:
      - Cloud Backups
      parameters:
      - name: envelope
        in: query
        description: Flag that indicates whether Application wraps the response in an `envelope` JSON object. Some API clients
          cannot access the HTTP response headers or status code. To remediate this, set envelope=true in the query. Endpoints
          that return a list of results use the results object as an envelope. Application adds the status parameter to the
          response body.
        schema: &id001
          default: false
          type: boolean
      - name: groupId
        in: path
        required: true
        description: 'Unique 24-hexadecimal digit string that identifies your project. Use the [/groups](#tag/Projects/operation/listProjects)
          endpoint to retrieve all projects to which the authenticated user has access.


          **NOTE**: Groups and projects are synonymous terms. Your group id is the same as your project id. For existing groups,
          your group/project id remains the same. The resource and corresponding endpoints use the term groups.'
        schema: &id002
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          type: string
      - name: pretty
        in: query
        description: Flag that indicates whether the response body should be in the prettyprint format.
        schema: &id003
          default: false
          externalDocs:
            description: Prettyprint
            url: https://en.wikipedia.org/wiki/Prettyprint
          type: boolean
      requestBody:
        content:
          application/vnd.atlas.2023-01-01+json:
            schema:
                $ref: '#/components/schemas/DiskBackupSnapshotAWSExportBucketRequest'
          application/vnd.atlas.2024-05-30+json:
            schema:
                $ref: '#/components/schemas/DiskBackupSnapshotExportBucketRequest'
      responses:
        '200':
          description: OK
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                type: object
            application/vnd.atlas.2024-05-30+json:
              schema:
                type: object
    get:
      description: Returns all Export Buckets associated with the specified Project.
      operationId: listGroupBackupExportBuckets
      tags:
      - Cloud Backups
      parameters:
      - name: envelope
        in: query
        description: Flag that indicates whether Application wraps the response in an `envelope` JSON object. Some API clients
          cannot access the HTTP response headers or status code. To remediate this, set envelope=true in the query. Endpoints
          that return a list of results use the results object as an envelope. Application adds the status parameter to the
          response body.
        schema: *id001
      - name: groupId
        in: path
        required: true
        description: 'Unique 24-hexadecimal digit string that identifies your project. Use the [/groups](#tag/Projects/operation/listProjects)
          endpoint to retrieve all projects to which the authenticated user has access.


          **NOTE**: Groups and projects are synonymous terms. Your group id is the same as your project id. For existing groups,
          your group/project id remains the same. The resource and corresponding endpoints use the term groups.'
        schema: *id002
      - name: includeCount
        in: query
        description: Flag that indicates whether the response returns the total number of items (`totalCount`) in the response.
        schema: &id004
          default: true
          type: boolean
      - name: itemsPerPage
        in: query
        description: Number of items that the response returns per page.
        schema: &id005
          default: 100
          maximum: 500
          minimum: 1
          type: integer
      - name: pageNum
        in: query
        description: Number of the page that displays the current set of the total objects that the response returns.
        schema: &id006
          default: 1
          minimum: 1
          type: integer
      - name: pretty
        in: query
        description: Flag that indicates whether the response body should be in the prettyprint format.
        schema: *id003
      responses:
        '200':
          description: OK
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                type: object
            application/vnd.atlas.2024-05-30+json:
              schema:
                type: object
  /api/atlas/v2/groups/{groupId}/clusters:
    post:
      description: 'Creates one cluster in the specified project. Clusters contain a group of hosts that maintain the same
        data set. This resource can create clusters with asymmetrically-sized shards. Each project supports up to 25 database
        deployments. This feature is not available for serverless clusters.


        Please note that using an `instanceSize` of M2 or M5 will create a Flex cluster instead. Support for the `instanceSize`
        of M2 or M5 will be discontinued in January 2026. We recommend using the Create Flex Cluster API for such configurations
        moving forward.'
      operationId: createGroupCluster
      tags:
      - Clusters
      parameters:
      - name: envelope
        in: query
        description: Flag that indicates whether Application wraps the response in an `envelope` JSON object. Some API clients
          cannot access the HTTP response headers or status code. To remediate this, set envelope=true in the query. Endpoints
          that return a list of results use the results object as an envelope. Application adds the status parameter to the
          response body.
        schema: *id001
      - name: groupId
        in: path
        required: true
        description: 'Unique 24-hexadecimal digit string that identifies your project. Use the [/groups](#tag/Projects/operation/listProjects)
          endpoint to retrieve all projects to which the authenticated user has access.


          **NOTE**: Groups and projects are synonymous terms. Your group id is the same as your project id. For existing groups,
          your group/project id remains the same. The resource and corresponding endpoints use the term groups.'
        schema: *id002
      - name: pretty
        in: query
        description: Flag that indicates whether the response body should be in the prettyprint format.
        schema: *id003
      - description: Controls how hardware specification fields are returned in the response after cluster creation. When
          set to true, returns the original client-specified values and provides separate effective fields showing current
          operational values. When false (default), hardware specification fields show current operational values directly.
          Primarily used for autoscaling compatibility.
        in: header
        name: Use-Effective-Instance-Fields
        schema:
          default: false
          type: boolean
      - description: Controls how `replicationSpecs` fields are returned in the response. When set to `true`, stores the client's
          view of `replicationSpecs` and returns it in `replicationSpecs`, while the actual cluster state (including auto-scaled
          hardware and auto-added shards) is returned in `effectiveReplicationSpecs`. When `false` (default), `replicationSpecs`
          contains the actual cluster state.
        in: header
        name: Use-Effective-Fields-Replication-Specs
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/vnd.atlas.2023-01-01+json:
            schema:
                $ref: '#/components/schemas/LegacyAtlasCluster'
          application/vnd.atlas.2023-02-01+json:
            schema:
                $ref: '#/components/schemas/AdvancedClusterDescription'
          application/vnd.atlas.2024-08-05+json:
            schema:
                $ref: '#/components/schemas/ClusterDescription20240805'
          application/vnd.atlas.2024-10-23+json:
            schema:
                $ref: '#/components/schemas/ClusterDescription20240805'
      responses:
        '201':
          description: OK
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                type: object
            application/vnd.atlas.2023-02-01+json:
              schema:
                type: object
            application/vnd.atlas.2024-08-05+json:
              schema:
                type: object
            application/vnd.atlas.2024-10-23+json:
              schema:
                type: object
