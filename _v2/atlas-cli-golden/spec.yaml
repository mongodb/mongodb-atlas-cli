      type: object
    AdvancedClusterDescription:
      properties:
        acceptDataRisksAndForceReplicaSetReconfig:
          description: If reconfiguration is necessary to regain a primary due to a regional outage, submit this field alongside your topology reconfiguration to request a new regional outage resistant topology. Forced reconfigurations during an outage of the majority of electable nodes carry a risk of data loss if replicated writes (even majority committed writes) have not been replicated to the new primary node. MongoDB Atlas docs contain more information. To proceed with an operation which carries that risk, set `acceptDataRisksAndForceReplicaSetReconfig` to the current date. This parameter expresses its value in the ISO 8601 timestamp format in UTC.
          externalDocs:
            description: Reconfiguring a Replica Set during a regional outage
            url: https://dochub.mongodb.org/core/regional-outage-reconfigure-replica-set
          format: date-time
          type: string
        advancedConfiguration:
          $ref: '#/components/schemas/ApiAtlasClusterAdvancedConfigurationView'
        backupEnabled:
          default: false
          description: Flag that indicates whether the cluster can perform backups. If set to `true`, the cluster can perform backups. You must set this value to `true` for NVMe clusters. Backup uses [Cloud Backups](https://docs.atlas.mongodb.com/backup/cloud-backup/overview/) for dedicated clusters and [Shared Cluster Backups](https://docs.atlas.mongodb.com/backup/shared-tier/overview/) for tenant clusters. If set to `false`, the cluster doesn't use backups.
          type: boolean
        biConnector:
          $ref: '#/components/schemas/BiConnector'
        clusterType:
          description: Configuration of nodes that comprise the cluster.
          enum:
          - REPLICASET
          - SHARDED
          - GEOSHARDED
          type: string
        configServerManagementMode:
          default: ATLAS_MANAGED
          description: Config Server Management Mode for creating or updating a sharded cluster. When configured as `ATLAS_MANAGED`, Atlas may automatically switch the cluster's config server type for optimal performance and savings. When configured as `FIXED_TO_DEDICATED`, the cluster will always use a dedicated config server.
          enum:
          - ATLAS_MANAGED
          - FIXED_TO_DEDICATED
          externalDocs:
            description: MongoDB Sharded Cluster Config Servers
            url: https://dochub.mongodb.org/docs/manual/core/sharded-cluster-config-servers
          type: string
        configServerType:
          description: Describes a sharded cluster's config server type.
          enum:
          - DEDICATED
          - EMBEDDED
          externalDocs:
            description: MongoDB Sharded Cluster Config Servers
            url: https://dochub.mongodb.org/docs/manual/core/sharded-cluster-config-servers
          readOnly: true
          type: string
        connectionStrings:
          $ref: '#/components/schemas/ClusterConnectionStrings'
        createDate:
          description: Date and time when MongoDB Cloud created this cluster. This parameter expresses its value in ISO 8601 format in UTC.
          format: date-time
          readOnly: true
          type: string
        diskSizeGB:
          description: "Storage capacity of instance data volumes expressed in gigabytes. Increase this number to add capacity.\n\n This value is not configurable on M0/M2/M5 clusters.\n\n MongoDB Cloud requires this parameter if you set `replicationSpecs`.\n\n If you specify a disk size below the minimum (10 GB), this parameter defaults to the minimum disk size value. \n\n Storage charge calculations depend on whether you choose the default value or a custom value.\n\n The maximum value for disk storage cannot exceed 50 times the maximum RAM for the selected cluster. If you require more storage space, consider upgrading your cluster to a higher tier."
          externalDocs:
            description: Customize Storage
            url: https://dochub.mongodb.org/core/customize-storage
          format: double
          type: number
        diskWarmingMode:
          default: FULLY_WARMED
          description: Disk warming mode selection.
          enum:
          - FULLY_WARMED
          - VISIBLE_EARLIER
          - ENHANCED_FULLY_WARMED
          externalDocs:
            description: Reduce Secondary Disk Warming Impact
            url: https://docs.atlas.mongodb.com/reference/replica-set-tags/#reduce-secondary-disk-warming-impact
          type: string
        encryptionAtRestProvider:
          description: 'Cloud service provider that manages your customer keys to provide an additional layer of encryption at rest for the cluster. To enable customer key management for encryption at rest, the cluster `replicationSpecs[n].regionConfigs[m].{type}Specs.instanceSize` setting must be `M10` or higher and `"backupEnabled" : false` or omitted entirely.'
          enum:
          - NONE
          - AWS
          - AZURE
          - GCP
          externalDocs:
            description: Encryption at Rest using Customer Key Management
            url: https://www.mongodb.com/docs/atlas/security-kms-encryption/
          type: string
        featureCompatibilityVersion:
          description: Feature compatibility version of the cluster.
          readOnly: true
          type: string
        featureCompatibilityVersionExpirationDate:
          description: Feature compatibility version expiration date. This parameter expresses its value in the ISO 8601 timestamp format in UTC.
          format: date-time
          readOnly: true
          type: string
        globalClusterSelfManagedSharding:
          description: 'Set this field to configure the Sharding Management Mode when creating a new Global Cluster.
      
      
            When set to false, the management mode is set to Atlas-Managed Sharding. This mode fully manages the sharding of your Global Cluster and is built to provide a seamless deployment experience.
      
      
            When set to true, the management mode is set to Self-Managed Sharding. This mode leaves the management of shards in your hands and is built to provide an advanced and flexible deployment experience.
      
      
            This setting cannot be changed once the cluster is deployed.'
          externalDocs:
            description: Creating a Global Cluster
            url: https://dochub.mongodb.org/core/global-cluster-management
          type: boolean
        groupId:
          description: Unique 24-hexadecimal character string that identifies the project.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          readOnly: true
          type: string
        id:
          description: Unique 24-hexadecimal digit string that identifies the cluster.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          readOnly: true
          type: string
        labels:
          deprecated: true
          description: 'Collection of key-value pairs between 1 to 255 characters in length that tag and categorize the cluster. The MongoDB Cloud console doesn''t display your labels.
      
      
            Cluster labels are deprecated and will be removed in a future release. We strongly recommend that you use Resource tags instead.'
          externalDocs:
            description: Resource Tags
            url: https://dochub.mongodb.org/core/add-cluster-tag-atlas
          items:
            $ref: '#/components/schemas/ComponentLabel'
          type: array
        links:
          description: List of one or more Uniform Resource Locators (URLs) that point to API sub-resources, related API resources, or both. RFC 5988 outlines these relationships.
          externalDocs:
            description: Web Linking Specification (RFC 5988)
            url: https://datatracker.ietf.org/doc/html/rfc5988
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
          type: array
        mongoDBEmployeeAccessGrant:
          $ref: '#/components/schemas/EmployeeAccessGrantView'
        mongoDBMajorVersion:
          description: "MongoDB major version of the cluster.\n\nOn creation: Choose from the available versions of MongoDB, or leave unspecified for the current recommended default in the MongoDB Cloud platform. The recommended version is a recent Long Term Support version. The default is not guaranteed to be the most recently released version throughout the entire release cycle. For versions available in a specific project, see the linked documentation or use the API endpoint for [project LTS versions endpoint](#tag/Projects/operation/getProjectLTSVersions).\n\n On update: Increase version only by 1 major version at a time. If the cluster is pinned to a MongoDB feature compatibility version exactly one major version below the current MongoDB version, the MongoDB version can be downgraded to the previous major version."
          externalDocs:
            description: Available MongoDB Versions in Atlas
            url: https://www.mongodb.com/docs/atlas/reference/faq/database/#which-versions-of-mongodb-do-service-clusters-use-
          type: string
        mongoDBVersion:
          description: Version of MongoDB that the cluster runs.
          pattern: ([\d]+\.[\d]+\.[\d]+)
          readOnly: true
          type: string
        name:
          description: Human-readable label that identifies the advanced cluster.
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
          type: string
        paused:
          description: Flag that indicates whether the cluster is paused.
          type: boolean
        pitEnabled:
          description: Flag that indicates whether the cluster uses continuous cloud backups.
          externalDocs:
            description: Continuous Cloud Backups
            url: https://docs.atlas.mongodb.com/backup/cloud-backup/overview/
          type: boolean
        replicaSetScalingStrategy:
          default: WORKLOAD_TYPE
          description: 'Set this field to configure the replica set scaling mode for your cluster.
      
      
            By default, Atlas scales under `WORKLOAD_TYPE`. This mode allows Atlas to scale your analytics nodes in parallel to your operational nodes.
      
      
            When configured as `SEQUENTIAL`, Atlas scales all nodes sequentially. This mode is intended for steady-state workloads and applications performing latency-sensitive secondary reads.
      
      
            When configured as `NODE_TYPE`, Atlas scales your electable nodes in parallel with your read-only and analytics nodes. This mode is intended for large, dynamic workloads requiring frequent and timely cluster tier scaling. This is the fastest scaling strategy, but it might impact latency of workloads when performing extensive secondary reads.'
          enum:
          - SEQUENTIAL
          - WORKLOAD_TYPE
          - NODE_TYPE
          externalDocs:
            description: Modify the Replica Set Scaling Mode
            url: https://dochub.mongodb.org/core/scale-nodes
          type: string
        replicationSpecs:
          description: List of settings that configure your cluster regions. For Global Clusters, each object in the array represents a zone where your clusters nodes deploy. For non-Global sharded clusters and replica sets, this array has one object representing where your clusters nodes deploy.
          items:
            $ref: '#/components/schemas/ReplicationSpec'
          type: array
        rootCertType:
          default: ISRGROOTX1
          description: Root Certificate Authority that MongoDB Atlas cluster uses. MongoDB Cloud supports Internet Security Research Group.
          enum:
          - ISRGROOTX1
          type: string
        stateName:
          description: "Human-readable label that indicates any current activity being taken on this cluster by the Atlas control plane. With the exception of CREATING and DELETING states, clusters should always be available and have a Primary node even when in states indicating ongoing activity.\n\n - `IDLE`: Atlas is making no changes to this cluster and all changes requested via the UI or API can be assumed to have been applied.\n - `CREATING`: A cluster being provisioned for the very first time returns state CREATING until it is ready for connections. Ensure IP Access List and DB Users are configured before attempting to connect.\n - `UPDATING`: A change requested via the UI, API, AutoScaling, or other scheduled activity is taking place.\n - `DELETING`: The cluster is in the process of deletion and will soon be deleted.\n - `REPAIRING`: One or more nodes in the cluster are being returned to service by the Atlas control plane. Other nodes should continue to provide service as normal."
          enum:
          - IDLE
          - CREATING
          - UPDATING
          - DELETING
          - REPAIRING
          readOnly: true
          type: string
        tags:
          description: List that contains key-value pairs between 1 to 255 characters in length for tagging and categorizing the cluster.
          externalDocs:
            description: Resource Tags
            url: https://dochub.mongodb.org/core/add-cluster-tag-atlas
          items:
            $ref: '#/components/schemas/ResourceTag'
          type: array
        terminationProtectionEnabled:
          default: false
          description: Flag that indicates whether termination protection is enabled on the cluster. If set to `true`, MongoDB Cloud won't delete the cluster. If set to `false`, MongoDB Cloud will delete the cluster.
          type: boolean
        versionReleaseSystem:
          default: LTS
          description: Method by which the cluster maintains the MongoDB versions. If value is `CONTINUOUS`, you must not specify `mongoDBMajorVersion`.
          enum:
          - LTS
          - CONTINUOUS
          type: string
      type: object
    AdvancedComputeAutoScaling:
      description: Options that determine how this cluster handles CPU scaling.
      properties:
        enabled:
          description: 'Flag that indicates whether instance size reactive auto-scaling is enabled.
      
      
            - Set to `true` to enable instance size reactive auto-scaling. If enabled, you must specify a value for `replicationSpecs[n].regionConfigs[m].autoScaling.compute.maxInstanceSize`.
      
            - Set to `false` to disable instance size reactive auto-scaling.'
