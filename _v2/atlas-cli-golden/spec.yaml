    ClusterFlexProviderSettings:
      allOf:
      - $ref: '#/components/schemas/ClusterProviderSettings'
      - properties:
          backingProviderName:
            description: Cloud service provider on which MongoDB Cloud provisioned the multi-tenant host. The resource returns this parameter when `providerSettings.providerName` is `FLEX` and `providerSetting.instanceSizeName` is `FLEX`.
            enum:
            - AWS
            - GCP
            - AZURE
            type: string
          instanceSizeName:
            description: Cluster tier, with a default storage and memory capacity, that applies to all the data-bearing hosts in your cluster. You must set `providerSettings.providerName` to `FLEX` and specify the cloud service provider in `providerSettings.backingProviderName`.
            enum:
            - FLEX
            title: Flex Instance Sizes
            type: string
          regionName:
            description: Human-readable label that identifies the geographic location of your MongoDB cluster. The region you choose can affect network latency for clients accessing your databases. For a complete list of region names, see [AWS](https://docs.atlas.mongodb.com/reference/amazon-aws/#std-label-amazon-aws), [GCP](https://docs.atlas.mongodb.com/reference/google-gcp/), and [Azure](https://docs.atlas.mongodb.com/reference/microsoft-azure/).
            type: string
        type: object
      type: object
    ClusterFreeAutoScaling:
      description: Range of instance sizes to which your cluster can scale.
      properties:
        compute:
          $ref: '#/components/schemas/FreeComputeAutoScalingRules'
      type: object
    ClusterFreeProviderSettings:
      allOf:
      - $ref: '#/components/schemas/ClusterProviderSettings'
      - properties:
          autoScaling:
            $ref: '#/components/schemas/ClusterFreeAutoScaling'
          backingProviderName:
            description: "Cloud service provider on which MongoDB Cloud provisioned the multi-tenant host. The resource returns this parameter when `providerSettings.providerName` is `TENANT` and `providerSetting.instanceSizeName` is `M0`, `M2` or `M5`. \n\nPlease note that using an `instanceSize` of M2 or M5 will create a Flex cluster instead. Support for the `instanceSize` of M2 or M5 will be discontinued in January 2026. We recommend using the Create Flex Cluster API for such configurations moving forward."
            enum:
            - AWS
            - GCP
            - AZURE
            externalDocs:
              description: Create Flex Cluster API
              url: https://www.mongodb.com/docs/atlas/reference/api-resources-spec/v2/#tag/Flex-Clusters/operation/createFlexCluster
            type: string
          effectiveInstanceSizeName:
            description: The true tenant instance size. This is present to support backwards compatibility for deprecated provider types and/or instance sizes.
            enum:
            - FLEX
            - M2
            - M5
            - M0
            readOnly: true
            type: string
          instanceSizeName:
            description: Cluster tier, with a default storage and memory capacity, that applies to all the data-bearing hosts in your cluster. You must set `providerSettings.providerName` to `TENANT` and specify the cloud service provider in `providerSettings.backingProviderName`.
            enum:
            - M0
            - M2
            - M5
            title: Tenant Instance Sizes
            type: string
          regionName:
            description: Human-readable label that identifies the geographic location of your MongoDB cluster. The region you choose can affect network latency for clients accessing your databases. For a complete list of region names, see [AWS](https://docs.atlas.mongodb.com/reference/amazon-aws/#std-label-amazon-aws), [GCP](https://docs.atlas.mongodb.com/reference/google-gcp/), and [Azure](https://docs.atlas.mongodb.com/reference/microsoft-azure/). For multi-region clusters, see `replicationSpec.{region}`.
            type: string
        type: object
      type: object
    ClusterProviderSettings:
      description: Group of cloud provider settings that configure the provisioned MongoDB hosts.
      discriminator:
        mapping:
          AWS: '#/components/schemas/AWSCloudProviderSettings'
          AZURE: '#/components/schemas/AzureCloudProviderSettings'
          FLEX: '#/components/schemas/ClusterFlexProviderSettings'
          GCP: '#/components/schemas/CloudGCPProviderSettings'
          TENANT: '#/components/schemas/ClusterFreeProviderSettings'
        propertyName: providerName
      oneOf:
      - $ref: '#/components/schemas/AWSCloudProviderSettings'
      - $ref: '#/components/schemas/AzureCloudProviderSettings'
      - $ref: '#/components/schemas/CloudGCPProviderSettings'
      - $ref: '#/components/schemas/ClusterFreeProviderSettings'
      - $ref: '#/components/schemas/ClusterFlexProviderSettings'
      properties:
        providerName:
          type: string
      required:
      - providerName
      title: Cloud Service Provider Settings for a Cluster
      type: object
    ComponentLabel:
      description: Human-readable labels applied to this MongoDB Cloud component.
      properties:
        key:
          description: Key applied to tag and categorize this component.
          maxLength: 255
          minLength: 1
          type: string
        value:
          description: Value set to the Key applied to tag and categorize this component.
          maxLength: 255
          minLength: 1
          type: string
      title: Component Label
      type: object
    DataProtectionSettings:
      properties:
        authorizedEmail:
          description: Email address of the user who authorized to update the Backup Compliance Policy  settings.
          format: email
          type: string
        authorizedUserFirstName:
          description: First name of the user who authorized to update the Backup Compliance Policy  settings.
          type: string
        authorizedUserLastName:
          description: Last name of the user who authorized to update the Backup Compliance Policy  settings.
          type: string
        copyProtectionEnabled:
          default: false
          description: Flag that indicates whether to prevent cluster users from deleting backups copied to other regions, even if those additional snapshot regions are removed. If unspecified, this value defaults to false.
          type: boolean
        deletable:
          default: false
          description: Flag that indicates whether the Backup Compliance Policy is allowed to be disabled. It is default to false and a support ticket needs to be filed to request setting to true.
          externalDocs:
            description: Configure a Backup Compliance Policy
            url: https://www.mongodb.com/docs/atlas/backup/cloud-backup/backup-compliance-policy/
          readOnly: true
          type: boolean
        encryptionAtRestEnabled:
          default: false
          description: Flag that indicates whether Encryption at Rest using Customer Key  Management is required for all clusters with a Backup Compliance Policy. If unspecified, this value defaults to false.
          externalDocs:
            description: Encryption at Rest using Customer Key Management
            url: https://www.mongodb.com/docs/atlas/security-kms-encryption/
          type: boolean
        onDemandPolicyItem:
          $ref: '#/components/schemas/BackupComplianceOnDemandPolicyItem'
        pitEnabled:
          default: false
          description: Flag that indicates whether the cluster uses Continuous Cloud Backups with a Backup Compliance Policy. If unspecified, this value defaults to false.
          externalDocs:
            description: Continuous Cloud Backups
            url: https://docs.atlas.mongodb.com/backup/cloud-backup/overview/
          type: boolean
        projectId:
          description: Unique 24-hexadecimal digit string that identifies the project for the Backup Compliance Policy.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          type: string
        restoreWindowDays:
