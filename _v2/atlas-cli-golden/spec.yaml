  /api/atlas/v2/groups/{groupId}/clusters/{clusterName}:
    delete:
      description: 'Removes one cluster from the specified project. The cluster must have termination protection disabled
        in order to be deleted. This feature is not available for serverless clusters.


        This endpoint can also be used on Flex clusters that were created using the [Create Cluster](https://www.mongodb.com/docs/atlas/reference/api-resources-spec/v2/#tag/Clusters/operation/createCluster)
        endpoint or former M2/M5 clusters that have been migrated to Flex clusters until January 2026. Please use the Delete
        Flex Cluster endpoint for Flex clusters instead.'
      operationId: deleteGroupCluster
      tags:
      - Clusters
      parameters:
      - name: envelope
        in: query
        description: Flag that indicates whether Application wraps the response in an `envelope` JSON object. Some API clients
          cannot access the HTTP response headers or status code. To remediate this, set envelope=true in the query. Endpoints
          that return a list of results use the results object as an envelope. Application adds the status parameter to the
          response body.
        schema: *id001
      - name: pretty
        in: query
        description: Flag that indicates whether the response body should be in the prettyprint format.
        schema: *id003
      - name: groupId
        in: path
        required: true
        description: 'Unique 24-hexadecimal digit string that identifies your project. Use the [/groups](#tag/Projects/operation/listProjects)
          endpoint to retrieve all projects to which the authenticated user has access.


          **NOTE**: Groups and projects are synonymous terms. Your group id is the same as your project id. For existing groups,
          your group/project id remains the same. The resource and corresponding endpoints use the term groups.'
        schema: *id002
      - description: Human-readable label that identifies the cluster.
        in: path
        name: clusterName
        required: true
        schema:
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
          type: string
        examples:
          delete_cluster:
            value: '[your-cluster-name]'
      - description: Flag that indicates whether to retain backup snapshots for the deleted dedicated cluster.
        in: query
        name: retainBackups
        schema:
          type: boolean
      requestBody:
        content:
          application/vnd.atlas.2023-02-01+json:
            schema:
              type: object
      responses:
        '202':
          description: OK
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                type: object
            application/vnd.atlas.2023-02-01+json:
              schema:
                type: object
    get:
      description: 'Returns the details for one cluster in the specified project. Clusters contain a group of hosts that maintain
        the same data set. The response includes clusters with asymmetrically-sized shards. This feature is not available
        for serverless clusters.


        This endpoint can also be used on Flex clusters that were created using the [Create Cluster](https://www.mongodb.com/docs/atlas/reference/api-resources-spec/v2/#tag/Clusters/operation/createCluster)
        endpoint or former M2/M5 clusters that have been migrated to Flex clusters until January 2026. Please use the Get
        Flex Cluster endpoint for Flex clusters instead.'
      operationId: getGroupCluster
      tags:
      - Clusters
      parameters:
      - name: envelope
        in: query
        description: Flag that indicates whether Application wraps the response in an `envelope` JSON object. Some API clients
          cannot access the HTTP response headers or status code. To remediate this, set envelope=true in the query. Endpoints
          that return a list of results use the results object as an envelope. Application adds the status parameter to the
          response body.
        schema: *id001
      - name: pretty
        in: query
        description: Flag that indicates whether the response body should be in the prettyprint format.
        schema: *id003
      - name: groupId
        in: path
        required: true
        description: 'Unique 24-hexadecimal digit string that identifies your project. Use the [/groups](#tag/Projects/operation/listProjects)
          endpoint to retrieve all projects to which the authenticated user has access.


          **NOTE**: Groups and projects are synonymous terms. Your group id is the same as your project id. For existing groups,
          your group/project id remains the same. The resource and corresponding endpoints use the term groups.'
        schema: *id002
      - description: Human-readable label that identifies this cluster.
        in: path
        name: clusterName
        required: true
        schema:
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
          type: string
        examples:
          get_cluster:
            value: '[your-cluster-name]'
      - description: Controls how hardware specification fields are returned in the response. When set to true, returns the
          original client-specified values and provides separate effective fields showing current operational values. When
          false (default), hardware specification fields show current operational values directly. Primarily used for autoscaling
          compatibility.
        in: header
        name: Use-Effective-Instance-Fields
        schema:
          default: false
          type: boolean
      - description: Controls how `replicationSpecs` are returned in the response. When set to `true`, returns the client-specified
          view in `replicationSpecs` and the actual cluster state in `effectiveReplicationSpecs`. When `false` (default),
          `replicationSpecs` contains the actual cluster state.
        in: header
        name: Use-Effective-Fields-Replication-Specs
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/vnd.atlas.2024-08-05+json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                type: object
            application/vnd.atlas.2023-02-01+json:
              schema:
                type: object
            application/vnd.atlas.2024-08-05+json:
              schema:
                type: object
    patch:
      description: 'Updates the details for one cluster in the specified project. Clusters contain a group of hosts that maintain
        the same data set. This resource can update clusters with asymmetrically-sized shards. To update a cluster''s termination
        protection, the requesting Service Account or API Key must have the Project Owner role. For all other updates, the
        requesting Service Account or API Key must have the Project Cluster Manager role, the Project Cluster Resilience Tester
        role, or the Project Replica Set Manager role. You can''t modify a paused cluster (`paused : true`). You must call
        this endpoint to set `paused : false`. After this endpoint responds with `paused : false`, you can call it again with
        the changes you want to make to the cluster. This feature is not available for serverless clusters.'
      operationId: updateGroupCluster
      tags:
      - Clusters
      parameters:
      - name: envelope
        in: query
        description: Flag that indicates whether Application wraps the response in an `envelope` JSON object. Some API clients
          cannot access the HTTP response headers or status code. To remediate this, set envelope=true in the query. Endpoints
          that return a list of results use the results object as an envelope. Application adds the status parameter to the
          response body.
        schema: *id001
      - name: groupId
        in: path
        required: true
        description: 'Unique 24-hexadecimal digit string that identifies your project. Use the [/groups](#tag/Projects/operation/listProjects)
          endpoint to retrieve all projects to which the authenticated user has access.


          **NOTE**: Groups and projects are synonymous terms. Your group id is the same as your project id. For existing groups,
          your group/project id remains the same. The resource and corresponding endpoints use the term groups.'
        schema: *id002
      - name: pretty
        in: query
        description: Flag that indicates whether the response body should be in the prettyprint format.
        schema: *id003
      - description: Human-readable label that identifies the cluster.
        in: path
        name: clusterName
        required: true
        schema:
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
          type: string
        examples:
          update_cluster:
            value: '[your-cluster-name]'
      - description: 'Controls how hardware specification fields are returned in the response after cluster updates. When
          set to true, returns the original client-specified values and provides separate effective fields showing current
          operational values. When false (default), hardware specification fields show current operational values directly.
          Note: When using this header with autoscaling enabled, MongoDB ignores `replicationSpecs` changes during updates.
          To intentionally override the `replicationSpecs`, disable this header.'
        in: header
        name: Use-Effective-Instance-Fields
        schema:
          default: false
          type: boolean
      - description: Controls how `replicationSpecs` fields are returned in the response. When set to `true`, stores the client's
          view of `replicationSpecs` and returns it in `replicationSpecs`, while the actual cluster state (including auto-scaled
          hardware and auto-added shards) is returned in `effectiveReplicationSpecs`. When `false` (default), `replicationSpecs`
          contains the actual cluster state.
        in: header
        name: Use-Effective-Fields-Replication-Specs
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/vnd.atlas.2023-01-01+json:
            schema:
              type: object
          application/vnd.atlas.2023-02-01+json:
            schema:
              type: object
          application/vnd.atlas.2024-08-05+json:
            schema:
              type: object
          application/vnd.atlas.2024-10-23+json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                type: object
            application/vnd.atlas.2023-02-01+json:
              schema:
                type: object
            application/vnd.atlas.2024-08-05+json:
              schema:
                type: object
            application/vnd.atlas.2024-10-23+json:
              schema:
                type: object
