          - 5
          - 7
          format: int32
          type: integer
        priority:
          description: Number that indicates the election priority of the region. To identify the Preferred Region of the cluster, set this parameter to `7`. The primary node runs in the **Preferred Region**. To identify a read-only region, set this parameter to `0`.
          format: int32
          maximum: 7
          minimum: 0
          type: integer
        readOnlyNodes:
          description: Number of read-only nodes in the region. Read-only nodes can never become the primary member, but can facilitate local reads. Use `replicationSpecs[n].{region}.readOnlyNodes` instead.
          format: int32
          type: integer
      title: Region Configuration
      type: object
    ReplicationSpec:
      description: Details that explain how MongoDB Cloud replicates data on the specified MongoDB database.
      properties:
        id:
          description: Unique 24-hexadecimal digit string that identifies the replication object for a zone in a Multi-Cloud Cluster. If you include existing zones in the request, you must specify this parameter. If you add a new zone to an existing Multi-Cloud Cluster, you may specify this parameter. The request deletes any existing zones in the Multi-Cloud Cluster that you exclude from the request.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          readOnly: true
          type: string
        numShards:
          description: "Positive integer that specifies the number of shards to deploy in each specified zone. If you set this value to `1` and `clusterType` is `SHARDED`, MongoDB Cloud deploys a single-shard sharded cluster. Don't create a sharded cluster with a single shard for production environments. Single-shard sharded clusters don't provide the same benefits as multi-shard configurations.\n\n If you are upgrading a replica set to a sharded cluster, you cannot increase the number of shards in the same update request.  You should wait until after the cluster has completed upgrading to sharded and you have reconnected all application clients to the MongoDB router before adding additional shards. Otherwise, your data might become inconsistent once MongoDB Cloud begins distributing data across shards."
          format: int32
          minimum: 1
          type: integer
        regionConfigs:
          description: 'Hardware specifications for nodes set for a given region. Each `regionConfigs` object must be unique by region and cloud provider within the `replicationSpec`. Each `regionConfigs` object describes the region''s priority in elections and the number and type of MongoDB nodes that MongoDB Cloud deploys to the region. Each `regionConfigs` object must have either an `analyticsSpecs` object, `electableSpecs` object, or `readOnlySpecs` object. Tenant clusters only require `electableSpecs`. Dedicated clusters can specify any of these specifications, but must have at least one `electableSpecs` object within a `replicationSpec`. Every hardware specification must use the same `instanceSize`.
      
      
            **Example:**
      
      
            If you set `replicationSpecs[n].regionConfigs[m].analyticsSpecs.instanceSize` : `M30`, set `replicationSpecs[n].regionConfigs[m].electableSpecs.instanceSize` : `M30` if you have electable nodes and `replicationSpecs[n].regionConfigs[m].readOnlySpecs.instanceSize` : `M30` if you have read-only nodes.'
          items:
            $ref: '#/components/schemas/CloudRegionConfig'
          type: array
        zoneId:
          description: Unique 24-hexadecimal digit string that identifies a zone in a Global Cluster.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          readOnly: true
          type: string
        zoneName:
          description: 'Human-readable label that identifies the zone in a Global Cluster. Provide this value only if `"clusterType" : "GEOSHARDED"`.'
          type: string
      title: Replication Specifications
      type: object
    ReplicationSpec20240805:
      description: Details that explain how MongoDB Cloud replicates data on the specified MongoDB database.
      properties:
        id:
          description: Unique 24-hexadecimal digit string that identifies the replication object for a shard in a Cluster. If you include existing shard replication configurations in the request, you must specify this parameter. If you add a new shard to an existing Cluster, you may specify this parameter. The request deletes any existing shards  in the Cluster that you exclude from the request. This corresponds to Shard ID displayed in the UI.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          readOnly: true
          type: string
        regionConfigs:
          description: 'Hardware specifications for nodes set for a given region. Each `regionConfigs` object must be unique by region and cloud provider within the `replicationSpec`. Each `regionConfigs` object describes the region''s priority in elections and the number and type of MongoDB nodes that MongoDB Cloud deploys to the region. Each `regionConfigs` object must have either an `analyticsSpecs` object, `electableSpecs` object, or `readOnlySpecs` object. Tenant clusters only require `electableSpecs`. Dedicated clusters can specify any of these specifications, but must have at least one `electableSpecs` object within a `replicationSpec`.
      
      
            **Example:**
      
      
            If you set `replicationSpecs[n].regionConfigs[m].analyticsSpecs.instanceSize` : `M30`, set `replicationSpecs[n].regionConfigs[m].electableSpecs.instanceSize` : `M30` if you have electable nodes and `replicationSpecs[n].regionConfigs[m].readOnlySpecs.instanceSize` : `M30` if you have read-only nodes.'
          items:
            $ref: '#/components/schemas/CloudRegionConfig20240805'
          type: array
        zoneId:
          description: Unique 24-hexadecimal digit string that identifies the zone in a Global Cluster. This value can be used to configure Global Cluster backup policies.
          example: 32b6e34b3d91647abb20e7b8
          pattern: ^([a-f0-9]{24})$
          readOnly: true
          type: string
        zoneName:
          description: 'Human-readable label that describes the zone this shard belongs to in a Global Cluster. Provide this value only if `clusterType` : `GEOSHARDED` but not `selfManagedSharding` : `true`.'
          type: string
      title: Replication Specifications
      type: object
    ResourceTag:
      description: 'Key-value pair that tags and categorizes a MongoDB Cloud organization, project, or cluster. For example, `environment : production`.'
      properties:
        key:
          description: 'Constant that defines the set of the tag. For example, `environment` in the `environment : production` tag.'
          maxLength: 255
          minLength: 1
          type: string
        value:
          description: 'Variable that belongs to the set of the tag. For example, `production` in the `environment : production` tag.'
          maxLength: 255
          minLength: 1
          type: string
      required:
      - key
      - value
      title: Resource Tag
      type: object
    SqlInterfaceStatusUpdateRequest:
      properties:
        status:
          description: Current or desired SQL Interface status for the cluster. The GET endpoint returns OFF when no status is configured.
          enum:
          - 'ON'
          - 'OFF'
          type: string
      required:
      - status
      type: object
    TenantHardwareSpec:
      properties:
        effectiveInstanceSize:
          description: The true tenant instance size. This is present to support backwards compatibility for deprecated provider types and/or instance sizes.
          enum:
          - FLEX
          - M2
          - M5
          - M0
          readOnly: true
          type: string
        instanceSize:
          description: Hardware specification for the instances in this M0/M2/M5 tier cluster.
          enum:
          - M0
          - M2
          - M5
          title: Tenant Instance Sizes
          type: string
      type: object
    TenantHardwareSpec20240805:
      properties:
        diskSizeGB:
          description: "Storage capacity of instance data volumes expressed in gigabytes. Increase this number to add capacity.\n\n This value must be equal for all shards and node types.\n\n This value is not configurable on M0/M2/M5 clusters.\n\n MongoDB Cloud requires this parameter if you set `replicationSpecs`.\n\n If you specify a disk size below the minimum (10 GB), this parameter defaults to the minimum disk size value. \n\n Storage charge calculations depend on whether you choose the default value or a custom value.\n\n The maximum value for disk storage cannot exceed 50 times the maximum RAM for the selected cluster. If you require more storage space, consider upgrading your cluster to a higher tier."
          externalDocs:
            description: Customize Storage
            url: https://dochub.mongodb.org/core/customize-storage
          format: double
          type: number
        effectiveInstanceSize:
          description: The true tenant instance size. This is present to support backwards compatibility for deprecated provider types and/or instance sizes.
          enum:
          - FLEX
          - M2
          - M5
          - M0
          readOnly: true
          type: string
        instanceSize:
          description: Hardware specification for the instances in this M0/M2/M5 tier cluster.
          enum:
          - M0
          - M2
          - M5
          title: Tenant Instance Sizes
          type: string
      type: object
    TenantRegionConfig:
