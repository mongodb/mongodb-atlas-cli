openapi: 3.0.1
info:
  title: quirk
  version: "1"
paths:
  /test:
    get:
      description: quirk under test
      operationId: quirkOp
      responses:
        "200":
          description: ok
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                $ref: '#/components/schemas/Quirk'
components:
  schemas:
    Quirk:
      oneOf:
        - $ref: '#/components/schemas/AWSRegions'
        - $ref: '#/components/schemas/AzureRegions'
      type: object
    AWSRegions:
      type: string
      enum: [SYDNEY_AUS, FRANKFURT_DEU]
    AzureRegions:
      type: string
      enum: [eastus, westus]