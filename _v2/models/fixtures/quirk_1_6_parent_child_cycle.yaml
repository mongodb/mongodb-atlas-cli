openapi: 3.0.1
info:
  title: quirk
  version: "1"
paths:
  /test:
    get:
      description: quirk under test
      operationId: quirkOp
      responses:
        "200":
          description: ok
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                $ref: '#/components/schemas/Quirk'
components:
  schemas:
    Quirk:
      discriminator:
        mapping:
          AWS: '#/components/schemas/AWSRegionConfig'
          TENANT: '#/components/schemas/TenantRegionConfig'
        propertyName: providerName
      oneOf:
        - $ref: '#/components/schemas/AWSRegionConfig'
        - $ref: '#/components/schemas/TenantRegionConfig'
      properties:
        providerName:
          type: string
          enum: [AWS, TENANT]
        regionName:
          type: string
      type: object
    AWSRegionConfig:
      allOf:
        - $ref: '#/components/schemas/Quirk'
        - properties:
            ebsVolumeType:
              type: string
          type: object
    TenantRegionConfig:
      allOf:
        - $ref: '#/components/schemas/Quirk'
        - properties:
            backupEnabled:
              type: boolean
          type: object