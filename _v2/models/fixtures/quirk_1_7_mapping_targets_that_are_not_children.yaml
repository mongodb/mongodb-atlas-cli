openapi: 3.0.1
info:
  title: quirk
  version: "1"
paths:
  /test:
    get:
      description: quirk under test
      operationId: quirkOp
      responses:
        "200":
          description: ok
          content:
            application/vnd.atlas.2023-01-01+json:
              schema:
                $ref: '#/components/schemas/Quirk'
components:
  schemas:
    Quirk:
      discriminator:
        mapping:
          aws: '#/components/schemas/AWSAccountDetails'
          gcp: '#/components/schemas/GCPAccountDetails'
        propertyName: cloudProvider
      oneOf:
        - $ref: '#/components/schemas/AWSAccountDetails'
        - $ref: '#/components/schemas/GCPAccountDetails'
      type: object
    AWSAccountDetails:
      properties:
        cloudProvider:
          type: string
        awsAccountId:
          type: string
      type: object
    GCPAccountDetails:
      properties:
        cloudProvider:
          type: string
        projectNumber:
          type: string
      type: object