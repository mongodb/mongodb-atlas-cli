exec_timeout_secs: 4200 # automatically fail any task if it takes longer than 1h10m to finish.
stepback: true
command_type: system
pre_error_fails_task: true
include:
  - filename: build/ci/release.yml

variables:
  - &go_linux_version
      go_root: "/opt/golang/go1.26"
      go_bin: "/opt/golang/go1.26/bin"
      go_base_path: ""
  - &go_env
      XDG_CONFIG_HOME: ${go_base_path}${workdir}
      GO111MODULE: "on"
      GOROOT: ${go_root}
      GOPATH: ${go_base_path}${workdir}
      ADD_PATH: "${go_bin}:${go_base_path}${workdir}/bin:${go_base_path}${workdir}/src/github.com/mongodb/mongodb-atlas-cli/bin"
      GOPROXY: ${go_proxy}
  - &go_options
    add_to_path:
      - ${go_bin}
      - ${go_base_path}${workdir}/bin
      - ${go_base_path}${workdir}/src/github.com/mongodb/mongodb-atlas-cli/bin
    include_expansions_in_env:
      - go_base_path
      - go_proxy
      - workdir
    working_dir: src/github.com/mongodb/mongodb-atlas-cli
    env:
      <<: *go_env
pre:
  - func: "clone"
  - func: "set-expansions"
post:
  - command: attach.xunit_results
    params:
      files: ["src/github.com/mongodb/mongodb-atlas-cli/*.xml"]
functions:
  "clone":
    - command: git.get_project
      type: setup
      params:
        directory: src/github.com/mongodb/mongodb-atlas-cli
  # Downloads the Go modules once in compile and caches them for the e2e tasks, in the
  # documented restore-then-produce-then-save order: the restore populates pkg/mod from the
  # cache (a no-op go mod download on a hit), the save skips when the restore hit. Keyed by
  # the checkout's go.mod/go.sum contents, so pin bumps that don't change dependencies reuse
  # the cache; v1 is a manual flush knob (bump it to invalidate every cached module set, e.g.
  # after a GOPATH layout change) and distro_arch scopes it per platform, since GOTOOLCHAIN=auto
  # puts a compiled toolchain inside the cached dir. Uses the project's existing
  # mongodb-mongocli-build bucket credentials (same as the s3.put for generated tasks) rather
  # than a role assumed from another project, under ${project}/go-mod-cache without version
  # scoping so the same content is shared across versions.
  "cache go modules":
    - command: cache.restore
      type: setup
      params: &go_mod_cache_params
        name: go-mods
        aws_key: ${aws_key}
        aws_secret: ${aws_secret}
        bucket: mongodb-mongocli-build
        remote_path: ${project}/go-mod-cache
        key_files:
          - src/github.com/mongodb/mongodb-atlas-cli/go.mod
          - src/github.com/mongodb/mongodb-atlas-cli/go.sum
        key_expansions: [ "v1", "${distro_arch}" ]
    - command: subprocess.exec
      type: setup
      params:
        <<: *go_options
        binary: go
        args: [ "mod", "download" ]
    - command: cache.save
      type: setup
      params:
        <<: *go_mod_cache_params
        paths:
          - pkg/mod
  "restore go modules":
    - command: cache.restore
      type: setup
      params: *go_mod_cache_params
  "build":
    - command: subprocess.exec
      type: test
      params:
        <<: *go_options
        command: make build
  "vendor deps":
    - command: subprocess.exec
      params:
        <<: *go_options
        binary: go
        args:
          - mod
          - vendor
    - command: subprocess.exec
      params:
        <<: *go_options
        binary: tar
        args:
          - czf
          - vendor.tar.gz
          - vendor
    - command: subprocess.exec
      params:
        <<: *go_options
        binary: rm
        args:
          - -rf
          - vendor
  "install mongodb database tools":
    - command: shell.exec
      type: setup
      params:
        <<: *go_options
        working_dir: src/github.com/mongodb/mongodb-atlas-cli/bin
        shell: bash
        env:
          <<: *go_env
          MONGODB_DATABASE_TOOLS_VERSION: 100.10.0
        script: |
          set -Eeou pipefail
          if [[ "$(uname -s)" == "Darwin"* ]]; then
            curl -sLo mongodb-database-tools.zip "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-macos-arm64-$MONGODB_DATABASE_TOOLS_VERSION.zip"
            unzip mongodb-database-tools.zip
            mv mongodb-database-tools-*/bin/* .
            rm -rf mongodb-database-tools-* mongodb-database-tools.zip
          else
            mkdir -p mongodb-database-tools
            curl -sfL "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-rhel70-x86_64-$MONGODB_DATABASE_TOOLS_VERSION.tgz" | tar zx -C mongodb-database-tools --strip-components 1
            mv mongodb-database-tools/bin/* .
            rm -rf mongodb-database-tools
          fi
  "e2e test":
    - command: subprocess.exec
      type: test
      params:
        <<: *go_options
        binary: make
        args:
          - build
    - command: shell.exec
      type: setup
      params:
        <<: *go_options
        env:
          <<: *go_env
          EDITOR: echo
        shell: bash
        script: |
          set -Eeou pipefail
          CONFIG_PATH=$(./bin/atlas config edit 2>/dev/null)
          cat <<EOF > "$CONFIG_PATH"
          skip_update_check = true
          silence_storage_warning = true
          telemetry_enabled = false

          [__e2e]
          org_id = '${atlas_org_id}'
          project_id = '${atlas_project_id}'
          public_api_key = '${atlas_public_api_key}'
          private_api_key = '${atlas_private_api_key}'
          ops_manager_url = '${mcli_ops_manager_url}'
          service = 'cloud'
          output = 'plaintext'

          [__e2e_gov]
          org_id = '${atlas_gov_org_id}'
          project_id = '${atlas_gov_project_id}'
          public_api_key = '${atlas_gov_public_api_key}'
          private_api_key = '${atlas_gov_private_api_key}'
          ops_manager_url = '${mcli_cloud_gov_ops_manager_url}'
          service = 'cloudgov'
          output = 'plaintext'

          [__e2e_snapshot]
          org_id = 'a0123456789abcdef012345a'
          project_id = 'b0123456789abcdef012345b'
          public_api_key = 'ABCDEF01'
          private_api_key = '12345678-abcd-ef01-2345-6789abcdef01'
          ops_manager_url = 'http://localhost:8080/'
          service = 'cloud'
          output = 'plaintext'
          EOF
    - command: subprocess.exec
      type: test
      params:
        <<: *go_options
        include_expansions_in_env:
          - go_base_path
          - workdir
          - TEST_CMD
          - E2E_TEST_PACKAGES
          - E2E_PROFILE_NAME
          - E2E_TEST_BUCKET
          - E2E_CLOUD_ROLE_ID
          - MONGODB_ATLAS_OPS_MANAGER_URL
          - LOCAL_KEY
          - KMIP_CA
          - KMIP_CERT
          - GCP_CREDENTIALS
          - AWS_ACCESS_KEY
          - AWS_SECRET_ACCESS_KEY
          - AZURE_TENANT_ID
          - AZURE_CLIENT_ID
          - AZURE_CLIENT_SECRET
          - E2E_TIMEOUT
          - E2E_FLEX_INSTANCE_NAME
          - E2E_PARALLEL
          - revision
        env:
          <<: *go_env
          MONGODB_ATLAS_SKIP_UPDATE_CHECK: "yes"
          MONGODB_ATLAS_SILENCE_STORAGE_WARNING: "true"
          DO_NOT_TRACK: "1"
          LOCALDEV_IMAGE: 901841024863.dkr.ecr.us-east-1.amazonaws.com/dockerhub/mongodb/mongodb-atlas-local
        command: make e2e-test
  "generate evergreen":
    - command: subprocess.exec
      type: test
      params:
        <<: *go_options
        include_expansions_in_env:
          - go_base_path
          - workdir
          - task_type
          - e2e_variant
          - e2e_task_prefix
          - e2e_include_groups
          - e2e_exclude_groups
          - e2e_exclude
          - e2e_profile
        binary: build/ci/evergreen-generate-tasks.sh
    - command: s3.put
      params:
        aws_key: ${aws_key}
        aws_secret: ${aws_secret}
        local_files_include_filter:
          - src/github.com/mongodb/mongodb-atlas-cli/tasks.json
        remote_file: ${project}/dist/${revision}_${created_at}/atlascli/${task_type}/
        bucket: mongodb-mongocli-build
        permissions: public-read
        content_type: ${content_type|application/json}
        display_name: internal-bucket
    - command: generate.tasks
      params:
        files:
          - tasks.json
  "authenticate to ecr":
    - command: ec2.assume_role
      params:
        role_arn: ${ecr_role_arn|arn:aws:iam::901841024863:role/ecr-role-evergreen-ro}
    - command: subprocess.exec
      params:
        <<: *go_options
        include_expansions_in_env:
          - AWS_ACCESS_KEY_ID
          - AWS_SECRET_ACCESS_KEY
          - AWS_SESSION_TOKEN
        binary: build/package/ecr-login.sh
  "increase inotify limits":
    - command: shell.exec
      params:
        shell: bash
        script: |
          set -e
          if [[ "$(uname -s)" == "Darwin"* ]]; then
            echo "No need to increase inotify limits on macOS"
          else
            cat /proc/sys/fs/inotify/max_user_watches
            cat /proc/sys/fs/inotify/max_user_instances
            echo 1024 | sudo tee /proc/sys/fs/inotify/max_user_instances
            cat /proc/sys/fs/inotify/max_user_instances
          fi
  "set-expansions":
    - command: shell.exec
      params:
        <<: *go_options
        shell: bash
        script: |
          set -Eeou pipefail
          cat <<EOF > expansions.yaml
          home: $HOME
          tag: $(./build/package/git-version.sh tag)
          version: $(./build/package/git-version.sh version)
          EOF
    - command: expansions.update
      params:
        ignore_missing_file: true
        file: src/github.com/mongodb/mongodb-atlas-cli/expansions.yaml
    - command: subprocess.exec
      params:
        <<: *go_options
        binary: rm
        args:
          - -f
          - expansions.yaml
  "check purls":
    - command: subprocess.exec
      type: test
      params:
        <<: *go_options
        binary: make
        args: 
        - gen-purls
    - command: subprocess.exec
      params:
        <<: *go_options
        include_expansions_in_env:
          - workdir
        binary: build/ci/check-purls.sh

tasks:
  - name: compile
    tags: ["code_health"]
    commands:
      - func: "cache go modules"
      - func: "build"
  - name: atlas_cleanup_e2e
    tags: [ "e2e","cleanup", "foliage_check_task_only" ]
    must_have_test_results: true
    exec_timeout_secs: 11400 # 3 hours 10 minutes
    stepback: false
    depends_on:
      - name: compile
        variant: "code_health"
        patch_optional: true
    commands:
      - func: "restore go modules"
      - func: "e2e test"
        timeout_secs: 11400 # 3 hours 10 minutes
        vars:
          E2E_TEST_PACKAGES: ./test/internal/...
          E2E_PARALLEL: 16
          E2E_TIMEOUT: 3h
  - name: atlas_gov_cleanup_e2e
    tags: [ "e2e","cleanup", "foliage_check_task_only" ]
    must_have_test_results: true
    exec_timeout_secs: 11400 # 3 hours 10 minutes
    stepback: false
    depends_on:
      - name: compile
        variant: "code_health"
        patch_optional: true
    commands:
      - func: "restore go modules"
      - func: "e2e test"
        timeout_secs: 11400 # 3 hours 10 minutes
        vars:
          E2E_PROFILE_NAME: __e2e_gov
          E2E_TEST_PACKAGES: ./test/internal/...
          E2E_TIMEOUT: 3h
          E2E_PARALLEL: 16
  - name: atlas_deployments_local_noauth_e2e
    tags: ["e2e","deployments","local","noauth"]
    must_have_test_results: true
    exec_timeout_secs: 11400 # 3 hours 10 minutes
    depends_on:
      - name: compile
        variant: "code_health"
        patch_optional: true
    commands:
      - func: "install mongodb database tools"
      - func: "increase inotify limits"
      - func: "authenticate to ecr"
      - func: "restore go modules"
      - func: "e2e test"
        timeout_secs: 11400 # 3 hours 10 minutes
        vars:
          E2E_TEST_PACKAGES: ./test/e2e/atlas/deployments/local/noauth/...
          E2E_TIMEOUT: 3h
  - name: atlas_deployments_local_seed
    tags: ["e2e","deployments","local","seed"]
    must_have_test_results: true
    exec_timeout_secs: 11400 # 3 hours 10 minutes
    depends_on:
      - name: compile
        variant: "code_health"
        patch_optional: true
    commands:
      - func: "install mongodb database tools"
      - func: "increase inotify limits"
      - func: "authenticate to ecr"
      - func: "restore go modules"
      - func: "e2e test"
        timeout_secs: 11400 # 3 hours 10 minutes
        vars:
          E2E_TEST_PACKAGES: ./test/e2e/atlas/deployments/local/seed/...
          E2E_TIMEOUT: 3h
  - name: atlas_deployments_local_nocli_e2e
    tags: ["e2e","deployments","local","nocli"]
    must_have_test_results: true
    exec_timeout_secs: 11400 # 3 hours 10 minutes
    depends_on:
      - name: compile
        variant: "code_health"
        patch_optional: true
    commands:
      - func: "install mongodb database tools"
      - func: "increase inotify limits"
      - func: "authenticate to ecr"
      - func: "restore go modules"
      - func: "e2e test"
        timeout_secs: 11400 # 3 hours 10 minutes
        vars:
          E2E_TEST_PACKAGES: ./test/e2e/atlas/deployments/local/nocli/...
          E2E_TIMEOUT: 3h
  - name: atlas_deployments_local_auth_e2e
    tags: ["e2e","deployments","local","auth","new"]
    must_have_test_results: true
    exec_timeout_secs: 11400 # 3 hours 10 minutes
    depends_on:
      - name: compile
        variant: "code_health"
        patch_optional: true
    commands:
      - func: "install mongodb database tools"
      - func: "increase inotify limits"
      - func: "authenticate to ecr"
      - func: "restore go modules"
      - func: "e2e test"
        timeout_secs: 11400 # 3 hours 10 minutes
        vars:
          E2E_TEST_PACKAGES: ./test/e2e/atlas/deployments/local/auth/new/...
          E2E_TIMEOUT: 3h
  - name: atlas_deployments_local_auth_deprecated_e2e
    tags: ["e2e","deployments","local","auth","deprecated"]
    must_have_test_results: true
    exec_timeout_secs: 11400 # 3 hours 10 minutes
    depends_on:
      - name: compile
        variant: "code_health"
        patch_optional: true
    commands:
      - func: "install mongodb database tools"
      - func: "increase inotify limits"
      - func: "authenticate to ecr"
      - func: "restore go modules"
      - func: "e2e test"
        timeout_secs: 11400 # 3 hours 10 minutes
        vars:
          E2E_TEST_PACKAGES: ./test/e2e/atlas/deployments/local/auth/deprecated/...
          E2E_TIMEOUT: 3h
  - name: check_purls
    tags: ["code_health"]
    commands:
      - func: "check purls"
  - name: snyk_monitor
    tags:
    - snyk
    commands:
      - command: shell.exec
        params:
          include_expansions_in_env:
            - workdir
          shell: bash
          script: |
            docker run \
              --rm \
              -e SNYK_TOKEN=${SNYK_TOKEN} \
              -e SNYK_CFG_ORG=${SNYK_ORG} \
              -v ${workdir}/src/github.com/mongodb/mongodb-atlas-cli:/app \
              snyk/snyk:golang snyk monitor
  - name: atlas_config_migration_e2e
    tags: ["e2e","config-migration"]
    must_have_test_results: true
    depends_on:
      - name: compile
        variant: "code_health"
        patch_optional: true
    commands:
      - func: "restore go modules"
      - func: "e2e test"
        vars:
          MONGODB_ATLAS_ORG_ID: ${atlas_org_id}
          MONGODB_ATLAS_PROJECT_ID: ${atlas_project_id}
          MONGODB_ATLAS_PRIVATE_API_KEY: ${atlas_private_api_key}
          MONGODB_ATLAS_PUBLIC_API_KEY: ${atlas_public_api_key}
          MONGODB_ATLAS_OPS_MANAGER_URL: ${mcli_ops_manager_url}
          MONGODB_ATLAS_SERVICE: cloud
          E2E_TEST_PACKAGES: ./test/e2e/noapi/config/migration/...
  - name: e2e_waterfall_generate
    stepback: false
    commands:
      - func: "generate evergreen"
        vars:
          task_type: e2e
          e2e_variant: e2e_waterfall
          e2e_exclude_groups: pr
  - name: e2e_pr_generate
    stepback: false
    commands:
      - func: "generate evergreen"
        vars:
          task_type: e2e
          e2e_variant: e2e_pr
          e2e_include_groups: pr
  - name: e2e_gov_generate
    stepback: false
    commands:
      - func: "generate evergreen"
        vars:
          task_type: e2e
          e2e_variant: e2e_gov
          e2e_include_groups: gov
          e2e_profile: __e2e_gov
buildvariants:
  - name: code_health
    display_name: "Code Health"
    run_on:
      - rhel80-small
    expansions:
      <<: *go_linux_version
    tasks:
      - name: .code_health
  - name: e2e_cleanup
    display_name: "E2E Cleanup Resources"
    allowed_requesters: ["patch", "ad_hoc", "github_pr"]
    tags:
      - cleanup
      - cron
      - foliage_health
    run_on:
      - rhel80-small
    expansions:
      <<: *go_linux_version
    tasks:
      - name: ".e2e .cleanup"
  - name: e2e_local_deployments_ubuntu24
    display_name: "E2E Local Deployments Tests (ubuntu 24.04/docker)"
    run_on:
      - ubuntu2404-small
    tags:
      - localdev
      - cron
      - foliage_health
    allowed_requesters: ["patch", "ad_hoc", "github_pr"]
    expansions:
      <<: *go_linux_version
    tasks:
      - name: ".e2e .deployments .local"
  - name: e2e_local_deployments_debian12
