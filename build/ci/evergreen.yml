patch_aliases:
  - alias: "localdev"
    variant_tags: ["localdev cron"]
    task: ".*"
  - alias: "cleanup"
    variant_tags: ["cleanup cron"]
    task: ".*"
  - alias: "snyk"
    variant_tags: ["snyk cron"]
    task: ".*"
github_pr_aliases:
  - variant: "code_health"
    task_tags: ["code_health"]
  - variant: "e2e_pr"
    task: ".*"
git_tag_aliases:
  - git_tag: "atlascli/v*"
    variant: "^release_atlascli"
    task: ".*"
  - git_tag: "v*"
    variant: "^release_atlascli"
    task: ".*"
github_checks_aliases:
 - variant: ".*"
   task: ".*"
