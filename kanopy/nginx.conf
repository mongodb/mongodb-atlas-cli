# This access log records only the URI path without query values.
log_format callback_no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout callback_no_query;
    default_type text/html;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'none'; font-src 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; img-src 'none'; media-src 'none'; object-src 'none'; script-src 'sha256-2SskL11L68a9uZB0gDIlQfX77ZIXySOTPMYTtruakdc='; style-src 'sha256-NpDBX5dGp6YkNnfTBy0hthhXFs7O3nZvR6MMC4/96Xw='" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /atlas-cli/oauth-callback.html {
        try_files /atlas-cli/oauth-callback/index.html =404;
    }

    location / {
        return 404;
    }
}
